name: Refresh data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'   # quick check for new releases; deploys only if something shipped
    - cron: '17 */3 * * *'   # full refresh: trending discovery, stars, HN — always deploys
  workflow_dispatch:
  repository_dispatch:       # lets an external webhook trigger an instant refresh
    types: [refresh]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The 10-minute check and the watcher's instant "refresh" are quick runs (deploy only if something
  # shipped); pushes, manual runs and the 3-hourly schedule are full refreshes.
  QUICK: ${{ (github.event.schedule == '*/10 * * * *' || github.event_name == 'repository_dispatch') && '1' || '0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ env.QUICK != '1' || steps.fetch.outputs.changed == 'true' }}
    steps:
      # The tip of main when this job starts, not the commit that queued the run: a run waiting behind
      # another would otherwise rebuild from data older than what the previous run just committed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch latest releases, changelogs & news
        id: fetch
        run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}   # optional: Artificial Analysis speed + indexes
      - name: Build site
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        run: node scripts/build.mjs
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT_SIDE: ${{ vars.ADSENSE_SLOT_SIDE }}
          ADSENSE_SLOT_INLINE: ${{ vars.ADSENSE_SLOT_INLINE }}
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          FEED_PROXY: ${{ vars.FEED_PROXY }}   # optional: My feed outside sources (worker/)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # README lookups when resolving new logos
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}   # optional: publishes the IndexNow key file
      - name: Pick new releases to announce
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        run: |
          git fetch --depth=1 origin main || true
          node scripts/announce.mjs plan
      - uses: actions/upload-artifact@v4
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        with:
          name: announce
          path: .announce/plan.json
          include-hidden-files: true
          retention-days: 3
      - name: Commit data snapshot (keeps history + keeps the schedule alive)
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "aiticker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh snapshot [skip ci]"
          git push || echo "push skipped"
      - uses: actions/configure-pages@v5
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: env.QUICK != '1' || steps.fetch.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Posts new releases to Bluesky / Telegram / Discord and pings IndexNow, once the pages are live.
  # Every channel is optional: unset secrets are skipped, and a failing channel never fails the deploy.
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: announce
          path: .announce
      - run: node scripts/announce.mjs send
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
